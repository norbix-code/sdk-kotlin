name: Release

# Publishes `ai.norbix:norbix-kotlin` to Maven Central with semantic-release on
# every push to `main` (and prerelease branches `next` / `beta`). The version
# comes from conventional commits since the last `v*` tag:
# `feat:` → minor, `fix:` → patch, `feat!:` / `BREAKING CHANGE:` → major.
#
# semantic-release checks the Maven Central secrets first (no tag is created
# without them), creates the `vX.Y.Z` tag, runs
# `./gradlew publishAndReleaseToMavenCentral` with that version, and then
# creates the GitHub Release. `main` is protected, so nothing is committed back.
#
# Required secrets:
#   - MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — Central Portal user token
#     (central.sonatype.com → Account → Generate User Token)
#   - SIGNING_KEY          — ASCII-armored GPG private key
#   - SIGNING_KEY_PASSWORD — its passphrase
#
# The baseline tag `v0.0.0` marks the root commit so the first release is 0.1.0.

on:
  push:
    branches: [main, next, beta]
  workflow_dispatch:
    inputs:
      republish:
        description: >-
          Recovery mode — skip semantic-release and publish the latest git tag
          to Maven Central (use when a tag exists but the upload failed).
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync branch tip
        # A run checks out its triggering SHA. When several merges land close
        # together that SHA is already behind origin and semantic-release
        # refuses to release; release from the remote tip instead.
        if: github.event_name != 'workflow_dispatch' || inputs.republish != true
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Setup Node (release tooling)
        if: github.event_name != 'workflow_dispatch' || inputs.republish != true
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        if: github.event_name != 'workflow_dispatch' || inputs.republish != true
        run: npm ci --no-audit --no-fund

      - name: Release
        if: github.event_name != 'workflow_dispatch' || inputs.republish != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Republish to Maven Central (recovery)
        if: github.event_name == 'workflow_dispatch' && inputs.republish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          VERSION="${TAG#v}"
          echo "Recovery publish: ai.norbix:norbix-kotlin:${VERSION} (from tag ${TAG})"
          if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/ai/norbix/norbix-kotlin/${VERSION}/norbix-kotlin-${VERSION}.pom"; then
            echo "Already on Maven Central — nothing to publish."
          else
            git checkout --detach "${TAG}"
            NORBIX_VERSION="${VERSION}" ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Release · ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "Latest tag: \`${TAG}\` — notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}" >> $GITHUB_STEP_SUMMARY
          fi
